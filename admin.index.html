<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KassiFleet | Administration</title>
  <link rel="stylesheet" href="css.js">
  <script src="admin.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Kassi<span>Fleet</span></a>
    <span>Restricted administration</span>
  </header>
  <main class="container">
    <section class="hero">
      <p class="eyebrow">PLATFORM OPERATIONS</p>
      <h1>Administration</h1>
      <p>Fleet, user and order overview.</p>
    </section>
    <section class="panel">
      <h2>Administrator sign in</h2>
      <form id="loginForm">
        <label>Email<input name="email" type="email" required></label>
        <label>Password<input name="password" type="password" required></label>
        <button>Sign in</button>
      </form>
      <p id="message" role="status"></p>
    </section>
    <section class="panel">
      <h2>Platform overview</h2>
      <button id="loadOverview">Load overview</button>
      <div id="overview" class="menu-grid"></div>
    </section>
  </main>
</body>
</html>
